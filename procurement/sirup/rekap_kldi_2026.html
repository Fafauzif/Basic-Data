<script>
var totalRekap = function(levelViewP, idKldiP, searchP, jenisP) {
	var listAction = function(options) {var pattern = '/sirup/home/totalrekap2017?idKldi=:idKldi&levelView=:levelView&search=:search&jenis=:jenis&tahunAnggaran=:tahunAnggaran';for(key in options) {var val = options[key];pattern = pattern.replace(':' + encodeURIComponent(key), ( (val===undefined || val===null)?'': val));}return pattern;}

		$('#totalRekap').load(listAction({tahunAnggaran: 2026, levelView:levelViewP, idKldi:idKldiP, search:searchP, jenis:jenisP}), function() {
		$('#content').css('visibility', 'visible');
	})
}
