<script>
var totalRekap = function(levelViewP, idKldiP, searchP, jenisID) {
	var listAction = function(options) {var pattern = '/sirup/home/totalrekap2017b?idKldi=:idKldi&levelView=:levelView&search=:search&jenisID=KABUPATEN&tahunAnggaran=:tahunAnggaran';for(key in options) {var val = options[key];pattern = pattern.replace(':' + encodeURIComponent(key), ( (val===undefined || val===null)?'': val));}return pattern;}

		$('#totalRekap').load(listAction({ jenisID:jenisID, tahunAnggaran: 2026, levelView:levelViewP, idKldi:idKldiP, search:searchP}), function() {
		$('#content').css('visibility', 'visible');
	})

}
$('[data-toggle="popoverTotal"]').popover({
		 title : '<span  style=\"color: black;\">Total</span>',

				 		"<b>Penjumlahan Paket dan Pagu antara Penyedia Murni, Swakelola dan Penyedia dalam Swakelola </b> <br/>"+
				"</div>"
	});
</script>
